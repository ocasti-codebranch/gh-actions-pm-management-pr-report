name: 'PR Data Reporter'
description: 'Sends PR and merge data to an external server'

inputs:
  api_key:
    description: 'API key for authentication'
    required: true
  fail_on_error:
    description: 'Whether to fail the build if the API request fails'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Fetch base branch
      shell: bash
      run: |
        git fetch origin ${{ github.event.pull_request.base.ref }}

    - name: Capture PR deltas
      id: deltas
      shell: bash
      env:
        BASE_REF: ${{ github.event.pull_request.base.ref }}
      run: |
        # Get diff stats
        DIFF_STATS=$(git diff --stat origin/$BASE_REF...HEAD)

        # Get raw diff content (limited to first 5000 characters)
        DIFF_CONTENT=$(git diff origin/$BASE_REF...HEAD | head -c 5000)

        # Write to files to preserve content safely
        echo "$DIFF_STATS" > /tmp/diff_stats.txt
        echo "$DIFF_CONTENT" > /tmp/diff_content.txt

    - name: Send PR data
      shell: bash
      env:
        API_KEY: ${{ inputs.api_key }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        PR_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ', ') }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        # Read diff data from files
        DIFF_STATS=$(cat /tmp/diff_stats.txt)
        DIFF_CONTENT=$(cat /tmp/diff_content.txt)

        json_payload=$(jq -n \
          --arg repository "${{ github.repository }}" \
          --arg event "${{ github.event_name }}" \
          --arg action "${{ github.event.action }}" \
          --argjson pr_number "${{ github.event.pull_request.number || 'null' }}" \
          --argjson merged "${{ github.event.pull_request.merged || false }}" \
          --arg title "$PR_TITLE" \
          --arg body "$PR_BODY" \
          --arg author "$PR_AUTHOR" \
          --arg base_branch "$PR_BASE_BRANCH" \
          --arg head_branch "$PR_HEAD_BRANCH" \
          --argjson run_id "${{ github.run_id }}" \
          --argjson run_number "${{ github.run_number }}" \
          --arg workflow_name "${{ github.workflow }}" \
          --arg labels "$PR_LABELS" \
          --arg pr_url "$PR_URL" \
          --arg stats "$DIFF_STATS" \
          --arg diff_content "$DIFF_CONTENT" \
          --argjson additions "${{ github.event.pull_request.additions || 0 }}" \
          --argjson deletions "${{ github.event.pull_request.deletions || 0 }}" \
          --argjson changed_files "${{ github.event.pull_request.changed_files || 0 }}" \
          '{
            repository: $repository,
            event: $event,
            action: $action,
            pr_number: $pr_number,
            merged: $merged,
            title: $title,
            body: $body,
            author: $author,
            base_branch: $base_branch,
            head_branch: $head_branch,
            run_id: $run_id,
            run_number: $run_number,
            workflow_name: $workflow_name,
            labels: $labels,
            pr_url: $pr_url,
            stats: $stats,
            diff_content: $diff_content,
            additions: $additions,
            deletions: $deletions,
            changed_files: $changed_files
          }')

        response=$(curl -s -w "\n%{http_code}" -X POST "https://pm.codebranch.app/api/v1/pr-ingest" \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $API_KEY" \
          -d "$json_payload")

        http_code=$(echo "$response" | tail -n1)
        body=$(echo "$response" | sed '$d')

        echo "Response: $body"
        echo "HTTP Status: $http_code"

        if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
          echo "::error::API request failed with status $http_code"
          if [[ "${{ inputs.fail_on_error }}" == "true" ]]; then
            exit 1
          fi
        fi
